name: Deploy Backend (EC2 SSH)

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/deploy-backend-ssh.yml

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || '22' }}
          script: |
            set -euo pipefail
            cd ${{ secrets.EC2_DEPLOY_PATH }}
            git fetch --all --prune
            git reset --hard origin/main
            cd backend
            npm ci
            npm run build
            export PORT="${{ secrets.BE_PORT || '3000' }}"
            export DYNAMODB_TABLE_NAME="${{ secrets.DYNAMODB_TABLE_NAME }}"
            export OPENAI_API_KEY="${{ secrets.OPENAI_API_KEY }}"
            export OPENAI_MODEL="${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}"
            export AWS_REGION="${{ secrets.AWS_REGION || 'us-east-1' }}"
            pm2 reload ecosystem.config.cjs --only erp-triage-backend --update-env || pm2 start ecosystem.config.cjs --only erp-triage-backend --update-env
